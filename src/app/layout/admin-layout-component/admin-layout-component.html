<div class="min-h-screen flex bg-[#F8FAFC]">

<!-- ═══════════ VOILE SOMBRE (téléphone, tiroir ouvert) ═══════════
     Un clic dessus referme le tiroir. Masqué sur ordinateur. -->
@if (sidebarOuverte()) {
<div class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden" aria-hidden="true" (click)="fermerSidebar()"></div>
}

<!-- Sidebar Sidebar/Navigation
     Ordinateur (≥ 1024 px) : fixe à gauche, comme avant.
     Téléphone : tiroir caché hors de l'écran, qui glisse quand on appuie sur les trois barres.
     (min-h-screen seulement sur ordinateur : sur mobile, 100vh dépasse la zone visible et
     masquerait le bouton Déconnexion sous la barre d'adresse du navigateur.) -->
<aside
 id="sidebar-admin"
 aria-label="Menu de navigation"
 (click)="surClicSidebar($event)"
 class="fixed inset-y-0 left-0 z-50 w-64 max-w-[85vw] overflow-y-auto bg-white border-r border-slate-200/80 flex flex-col justify-between shrink-0 p-4 transition-[transform,visibility] duration-200 ease-out lg:static lg:z-auto lg:max-w-none lg:min-h-screen lg:translate-x-0"
 [class]="sidebarOuverte() ? 'translate-x-0' : '-translate-x-full max-lg:invisible'"
>

<div>
<!-- Logo Header -->
<div class="flex items-center gap-3 px-2 py-3 mb-6">
<img src="/images/logo%20Kcrowd.png" alt="Kcrowd" class="w-10 h-10 object-contain rounded-2xl bg-white border border-slate-200  shrink-0" />
<div class="leading-tight">
<span class="block font-black text-[#0042D8] text-base tracking-tight">Kcrowd Admin</span>
<span class="block text-[10px] font-bold text-slate-400">Supervision Globale</span>
</div>

<!-- Bouton ✕ : téléphone uniquement -->
<button
 #boutonFermer
 type="button"
 (click)="fermerSidebar()"
 aria-label="Fermer le menu"
 class="lg:hidden ml-auto -mr-1 p-2 rounded-xl text-slate-500 hover:bg-slate-100 shrink-0"
>
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true">
<path d="M6 6l12 12M18 6L6 18" />
</svg>
</button>
</div>

<!-- Navigation Principale -->
<nav class="space-y-1.5">
@for (item of navItems; track item.path) {
<a
[routerLink]="item.path"
routerLinkActive="bg-blue-50 text-[#0042D8] font-extrabold"
[routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
class="flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all group"
>
<div class="flex items-center gap-3">
<app-icon [name]="item.icon" [size]="18" class="text-slate-400 group-[.bg-blue-50]:text-[#0042D8] transition-colors"></app-icon>
<span>{{ item.label }}</span>
</div>

<!-- Badge réel : uniquement sur "Notifications", uniquement s'il y a
     vraiment au moins une notification non lue. Le "6" en dur a
     disparu, ce chiffre vient maintenant de Django. -->
@if (item.path === '/admin/notifications' && notificationsStore.nonLues() > 0) {
<span class="bg-[#0042D8] text-white text-[10px] font-black px-2 py-0.5 rounded-full">
                {{ notificationsStore.nonLues() > 9 ? '9+' : notificationsStore.nonLues() }}
</span>
            }
</a>
        }
</nav>
</div>

<!-- Section Bas de Sidebar (Paramètres & Déconnexion) -->
<div class="space-y-1 pt-4 border-t border-slate-100">

<!-- Paramètres Système -->
<!-- <a
routerLink="/admin/parametres"
routerLinkActive="bg-blue-50 text-[#0042D8] font-extrabold"
class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all group"
>
<svg class="w-4 h-4 text-slate-400 group-[.bg-blue-50]:text-[#0042D8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
</svg>
<span>Paramètres système</span>
</a> -->

<!-- Bouton Déconnexion -->
<button
type="button"
(click)="seDeconnecter()"
class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-xs font-bold text-[#D04910] hover:bg-orange-50 transition-all"
>
<svg class="w-4 h-4 text-[#D04910]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
</svg>
<span>Déconnexion</span>
</button>

</div>

</aside>

<!-- Zone de Contenu Principal
     Tiroir ouvert : tout ce qui est derrière devient inerte (ni cliquable, ni
     atteignable au clavier) — comportement d'une vraie fenêtre modale. -->
<div class="flex-1 flex flex-col min-w-0" [attr.inert]="sidebarOuverte() ? '' : null">

<!-- Barre du haut : TÉLÉPHONE UNIQUEMENT. Sur ordinateur, la barre latérale est toujours là,
     il n'y a donc rien à ouvrir. Elle reste collée en haut pendant qu'on fait défiler la page. -->
<header class="lg:hidden sticky top-0 z-30 h-14 bg-white border-b border-slate-200/80 px-4 flex items-center gap-3 shrink-0">
<!-- ☰ Les trois barres. Le point bleu signale des notifications non lues : sans lui, le compteur
     (rangé dans le tiroir fermé) serait invisible sur téléphone. -->
<button
 #boutonMenu
 type="button"
 (click)="ouvrirSidebar()"
 [attr.aria-label]="notificationsStore.nonLues() > 0 ? 'Ouvrir le menu (' + notificationsStore.nonLues() + ' notification(s) non lue(s))' : 'Ouvrir le menu'"
 aria-controls="sidebar-admin"
 [attr.aria-expanded]="sidebarOuverte()"
 class="relative -ml-2 p-2 rounded-xl text-slate-600 hover:bg-slate-100 shrink-0"
>
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true">
<path d="M4 6h16M4 12h16M4 18h16" />
</svg>
@if (notificationsStore.nonLues() > 0) {
<span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-[#0042D8] ring-2 ring-white" aria-hidden="true"></span>
}
</button>

<img src="/images/logo%20Kcrowd.png" alt="" class="w-8 h-8 object-contain rounded-xl bg-white border border-slate-200 shrink-0" />
<span class="font-black text-[#0042D8] text-base tracking-tight truncate">Kcrowd Admin</span>
</header>

<main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-auto">
<app-chatbot-widget-component></app-chatbot-widget-component>
<router-outlet></router-outlet>
</main>
</div>

</div>
