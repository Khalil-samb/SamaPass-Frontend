<div class="relative min-h-screen w-full flex items-center justify-center p-4 bg-slate-950 font-sans overflow-hidden">

  <!-- Image de fond réseau / architecture depuis Unsplash pour l'effet Glassmorphism -->
  <img
    src="https://images.stockcake.com/public/d/4/1/d417dce7-b6cb-4797-95c0-80ff747d65f4_large/vibrant-dance-party-stockcake.jpg"
    alt="Background"
    class="absolute inset-0 w-full h-full object-cover opacity-100 filter blur-sm scale-105"
  />

  <!-- Superposition sombre pour contraster -->
  <div class="absolute inset-0 bg-slate-950/60 backdrop-blur-md"></div>

  <!-- Carte Glassmorphism Épurée -->
  <div class="relative w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/15 rounded-2xl p-8 sm:p-10 transition-all duration-300">

    <!-- Zone Logo & Marque (Image via URL web) -->
    <div class="flex items-center gap-3.5 mb-8 pb-6 border-b border-white/10">

      <!-- Logo chargé via URL (Remplacez le src par l'URL de votre propre logo) -->
      <div class="w-11 h-11 rounded-xl bg-white/10 border border-white/20 p-2 flex items-center justify-center shrink-0">
        <img
          src="/images/logo%20Kcrowd.png"
          alt="Logo Kcrowd"
          class="w-full h-full object-contain rounded-lg"
        />
      </div>

      <div>
        <span class="block font-bold text-white text-base tracking-tight">Kcrowd</span>
        <span class="block text-[11px] font-semibold text-slate-300 tracking-wider uppercase">
          Espace Supervision
        </span>
      </div>
    </div>

    <!-- En-tête -->
    <div class="mb-6">
      <h1 class="text-xl font-bold text-white mb-1.5">
        Connexion Administrateur
      </h1>
      <p class="text-xs text-slate-300 leading-relaxed">
        Veuillez saisir vos identifiants pour accéder au panneau de contrôle.
      </p>
    </div>

    <!-- Formulaire -->
    <form (ngSubmit)="seConnecter()" class="space-y-4">

      <!-- Champ Email -->
      <div>
        <label class="block text-xs font-semibold text-slate-200 uppercase tracking-wider mb-1.5">
          Email
        </label>
        <input
          type="email"
          [(ngModel)]="emailModel"
          name="email"
          placeholder="admin@kcrowd.sn"
          class="w-full bg-slate-900/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-400 outline-none transition-all focus:border-indigo-400 focus:bg-slate-900/80"
        />
      </div>

      <!-- Champ Mot de passe -->
      <div>
        <label class="block text-xs font-semibold text-slate-200 uppercase tracking-wider mb-1.5">
          Mot de passe
        </label>
        <input
          type="password"
          [(ngModel)]="motDePasseModel"
          name="motDePasse"
          placeholder="••••••••••••"
          class="w-full bg-slate-900/50 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-400 outline-none transition-all focus:border-indigo-400 focus:bg-slate-900/80"
        />
      </div>

      <!-- Alerte Erreur -->
      @if (erreur()) {
        <div class="p-3 rounded-lg bg-red-500/15 border border-red-500/30 text-red-200 text-xs flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-red-400 shrink-0"></span>
          <span>{{ erreur() }}</span>
        </div>
      }

      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="connexionEnCours()"
        class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl py-3 font-semibold text-sm transition-all duration-200 active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
      >
        @if (connexionEnCours()) {
          <span class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
          <span>Connexion en cours...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>

    </form>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <span class="text-[11px] text-slate-400 font-medium">
        Plateforme sécurisée Kcrowd • Administrateur
      </span>
    </div>

  </div>
</div>
