<div class="w-full px-6 md:px-12 py-10">
      <h1 class="text-lg font-extrabold text-slate-900 mb-6">Mes favoris</h1>

      @if (loading()) {
        <p class="text-slate-400">Chargement...</p>
      } @else if (cartesFavorites().length === 0) {
        <div class="bg-white border border-slate-100 rounded-2xl p-10 text-center">
          <p class="text-slate-500 text-sm mb-4">Vous n'avez pas encore d'événement favori.</p>
          <a routerLink="/" class="text-blue-700 font-semibold text-sm hover:underline">Découvrir des événements →</a>
        </div>
      } @else {
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
          @for (carte of cartesFavorites(); track carte.id) {
            <div class="relative">
              <app-card-event-component [event]="carte" />
              <button
                type="button"
                (click)="retirer(carte.id)"
                class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/95 flex items-center justify-center  hover:scale-105 transition-transform"
                aria-label="Retirer des favoris"
              >
                <app-icon name="heart" [size]="15" [filled]="true" class="text-red-600"></app-icon>
              </button>
            </div>
          }
        </div>
      }
    </div>
