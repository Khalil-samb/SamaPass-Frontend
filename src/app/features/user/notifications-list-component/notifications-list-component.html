<div class="max-w-xl mx-auto px-6 py-10">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-lg font-extrabold text-slate-900">Notifications</h1>
        @if (nonLues().length > 0) {
          <button type="button" (click)="toutMarquerCommeLu()" class="text-xs font-semibold text-blue-700 hover:underline">
            Tout marquer comme lu
          </button>
        }
      </div>

      @if (loading()) {
        <p class="text-slate-400">Chargement...</p>
      } @else if (mesNotifications().length === 0) {
        <p class="text-slate-400 text-sm">Aucune notification pour l'instant.</p>
      } @else {
        <div class="space-y-2.5">
          @for (notif of mesNotifications(); track notif.id) {
            <button
              type="button"
              (click)="marquerCommeLue(notif)"
              class="w-full text-left flex items-start gap-3 bg-white border rounded-2xl p-4 transition-colors"
              [class]="notif.isRead ? 'border-slate-100' : 'border-blue-200 bg-blue-50/40'"
            >
              <span class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center shrink-0">
                <app-icon [name]="icone(notif.type)" [size]="16"></app-icon>
              </span>
              <div class="flex-1 min-w-0">
                <span class="block font-semibold text-slate-800 text-sm">{{ notif.title }}</span>
                <span class="block text-xs text-slate-500 mt-0.5">{{ notif.message }}</span>
                <span class="block text-[11px] text-slate-400 mt-1.5">{{ formaterDate(notif.createdAt) }}</span>
              </div>
              @if (!notif.isRead) {
                <span class="w-2 h-2 rounded-full bg-blue-600 shrink-0 mt-1.5"></span>
              }
            </button>
          }
        </div>
      }
    </div>
