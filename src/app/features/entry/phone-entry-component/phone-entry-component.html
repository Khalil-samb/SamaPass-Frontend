<!-- Fond principal avec dégradé bleu et formes 3D / Glassmorphism -->
<div class="relative min-h-screen w-full flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-slate-900 p-4 overflow-hidden">

  <!-- Formes décoratives en arrière-plan -->
  <div class="absolute top-10 left-10 w-48 h-48 bg-blue-500/20 rounded-full blur-2xl pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-72 h-72 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Carte de Connexion (Glassmorphism) -->
  <div class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 sm:p-10 text-center  text-white">

    <!-- Emplacement du Logo + Nom -->
    <div class="flex items-center justify-center gap-3 mb-6">
      <!-- 📍 EMPLACEMENT DU LOGO : Remplacez src par le chemin vers votre image de logo (sans texte) -->
      <img
        src="images/logo Kcrowd.png"
        alt="Logo Kcrowd"
        class="w-10 h-10 object-contain "
      />
      <span class="font-extrabold text-2xl tracking-wide text-white ">Kcrowd</span>
    </div>

    <!-- Titre & Description -->
    <h1 class="text-2xl font-bold mb-2">Bienvenue sur Kcrowd</h1>
    <p class="text-sm text-blue-100/80 leading-relaxed mb-6">
      Entrez votre nom et votre numéro de téléphone pour découvrir et acheter vos billets d'événements au Sénégal.
    </p>

    <!-- Formulaire de Connexion -->
    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4 text-left">

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-100">Votre nom complet</span>
        <input
          type="text"
          name="firstName"
          [(ngModel)]="firstName"
          placeholder="Ex. Khalil Samb"
          autocomplete="given-name"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-200/50 outline-none focus:border-white focus:bg-white/20 transition-all"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-100">Numéro de téléphone</span>
        <input
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          placeholder="Ex. 77 123 45 67"
          autocomplete="tel"
          class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-200/50 outline-none focus:border-white focus:bg-white/20 transition-all"
        />
      </label>

      @if (errorMessage()) {
        <p class="text-red-300 text-xs font-medium mt-1">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl   transition-all active:scale-[0.98]"
      >
        Continuer
      </button>
    </form>

    <p class="mt-6 text-xs text-blue-200/70 leading-relaxed">
      Un code de vérification vous sera envoyé par WhatsApp pour confirmer votre numéro.
    </p>
  </div>

  <app-otp-bottom-sheet-component
    [phone]="phone"
    [showOtpSheet]="showOtpSheet()"
    (verified)="onOtpVerified($event)"
    (closed)="onOtpSheetClosed()"
    (resend)="onSubmit()"
  ></app-otp-bottom-sheet-component>
</div>
