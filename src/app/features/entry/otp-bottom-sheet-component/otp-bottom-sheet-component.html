
@if (showOtpSheet) {
  <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-40 transition-opacity" (click)="close()"></div>

  <div class="fixed left-1/2 -translate-x-1/2 bottom-0 sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 z-50 w-full max-w-md bg-slate-900/90 backdrop-blur-2xl border border-white/10 rounded-t-3xl sm:rounded-3xl p-6 sm:p-8 text-center  text-white">

    <!-- Barre supérieure mobile -->
    <div class="w-10 h-1 bg-white/20 rounded-full mx-auto mb-5 sm:hidden"></div>

    <!-- Bouton Fermer -->
    <button
      (click)="close()"
      aria-label="Fermer"
      class="absolute top-4 right-4 text-white/60 hover:text-white transition-colors p-2"
    >
      ✕
    </button>

    <h2 class="text-xl font-bold mb-2">Vérification</h2>
    <p class="text-sm text-blue-200/80 leading-relaxed mb-6">
      Entrez le code à 4 chiffres envoyé au <br/>
      <strong class="text-white">{{ phone }}</strong>
    </p>

    <!-- Cases pour le code OTP -->
    <div class="flex justify-center gap-3 mb-6">
      @for (digit of digits(); track $index) {
        <input
          type="text"
          inputmode="numeric"
          maxlength="1"
          [value]="digit"
          (input)="onDigitInput($index, $event)"
          (keydown)="onBackspace($event)"
          class="w-12 h-14 text-center text-2xl font-bold bg-white/10 border border-white/20 rounded-xl outline-none focus:border-blue-400 focus:bg-white/20 text-white transition-all"
        />
      }
    </div>

    @if (errorMessage()) {
      <p class="text-red-300 text-xs font-medium mb-4">{{ errorMessage() }}</p>
    }

    <!-- Bouton de confirmation -->
    <button
      [disabled]="isVerifying()"
      (click)="verifierLeCode()"
      class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl  transition-all disabled:opacity-50 disabled:cursor-not-allowed"
    >
      @if (isVerifying()) {
        Vérification en cours...
      } @else {
        Confirmer
      }
    </button>

    <!-- Renvoyer le code -->
    <button
      [disabled]="resendCooldown() > 0"
      (click)="resendCode()"
      class="block mx-auto mt-4 text-sm font-semibold text-blue-300 hover:text-blue-200 disabled:text-white/40 disabled:cursor-not-allowed transition-colors"
    >
      @if (resendCooldown() > 0) {
        Renvoyer le code ({{ resendCooldown() }}s)
      } @else {
        Renvoyer le code
      }
    </button>
  </div>
}
