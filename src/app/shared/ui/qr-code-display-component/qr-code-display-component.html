<div class="bg-white rounded-2xl border-2 border-dashed border-slate-200 p-6 text-center inline-block">
  <img [src]="urlDuQrCode" [width]="size" [height]="size" alt="QR Code du billet" class="mx-auto" />

  <!-- On affiche aussi le code en texte, au cas où le QR Code serait
           difficile à scanner (mauvaise lumière, écran fissuré...) -->
  <p class="mt-3 font-mono text-xs text-slate-400 tracking-wider">{{ value }}</p>
</div>
