    <div class="relative isolate overflow-hidden" (mouseenter)="enPause = true" (mouseleave)="enPause = false">

      @if (liste().length > 0) {
        <!-- Les images, empilées : seule la diapositive active est visible (fondu enchaîné) -->
        <div class="absolute inset-0 z-0" aria-hidden="true">
          @for (d of liste(); track d.id; let i = $index) {
            <img
              [src]="d.imageUrl"
              alt=""
              class="absolute inset-0 h-full w-full object-cover transition-opacity duration-1000 ease-in-out"
              [class]="i === indexActif() ? 'opacity-100' : 'opacity-0'"
            />
          }
          <!-- Voile sombre : garde le texte blanc lisible quelle que soit l'image -->
          <div class="absolute inset-0 bg-gradient-to-b from-slate-950/70 via-slate-900/55 to-slate-950/80"></div>
        </div>
      }

      <!-- Votre contenu, au-dessus des images -->
      <div class="relative z-10">
        <ng-content></ng-content>
      </div>

      @if (liste().length > 1) {
        <div class="absolute bottom-3 left-1/2 z-20 flex -translate-x-1/2 items-center gap-2">
          @for (d of liste(); track d.id; let i = $index) {
            <button
              type="button"
              (click)="aller(i)"
              [attr.aria-label]="'Afficher : ' + d.titre"
              class="h-2 rounded-full transition-all"
              [class]="i === indexActif() ? 'w-6 bg-white' : 'w-2 bg-white/40 hover:bg-white/70'"
            ></button>
          }
        </div>
      }

      @if (actuelle(); as a) {
        <a
          [routerLink]="['/evenements', a.id]"
          class="absolute bottom-3 left-4 z-20 hidden max-w-[45%] items-center gap-1.5 truncate text-[11px] font-semibold text-white/80 hover:text-white sm:flex"
        >
          <span class="text-white/60">À l'affiche :</span>
          <span class="truncate">{{ a.titre }}</span>
        </a>
      }
    </div>
