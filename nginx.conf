server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Le cœur de la configuration pour une SPA Angular : si le fichier
    # demandé n'existe pas tel quel sur le disque (ex. /organisateur,
    # /evenements/5df9f2e0...), on renvoie quand même index.html — c'est
    # Angular, une fois chargé, qui se charge d'afficher la bonne page.
    # Sans cette ligne, actualiser la page sur une route précise donnerait
    # une erreur 404 de Nginx, jamais vue par Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
